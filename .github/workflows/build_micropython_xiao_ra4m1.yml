name: Build MicroPython Firmware for Seeed Xiao MG24

on:
  workflow_call:
    inputs:
      trigger:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Clean disk space before build
      - name: Clean disk space before build
        run: |
          sudo apt clean
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -f || true
          npm cache clean --force || true
      
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install RA4M1 dependencies
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi
          sudo apt-get install -y git make cmake ninja-build gperf ccache \
            dfu-util device-tree-compiler python3-dev python3-pip python3-setuptools \
            python3-tk python3-wheel xz-utils file libpython3-dev libffi-dev gh

      # Build MicroPython for Xiao RA4M1
      - name: Build for Xiao RA4M1
        run: |
          # Build at the repo-wide MicroPython pin (v1.27.0, the lib/micropython
          # submodule checked out by actions/checkout) and apply the repo patch
          # set.  The old flow cloned micropython fresh and checked out upstream
          # PR #16409 (open, unmerged since 2024-12).  What this board actually
          # needs from that PR is only the USB LDO VDCEN enable -- the XIAO
          # RA4M1 powers USB from the internal LDO (USB_CFG_LDO_REGULATOR =
          # ENABLE in the board's FSP config), now carried as
          # 0002-renesas-ra-usb-ldo-vdcen.patch.  The WEACT board profile half
          # of #16409 is not needed: this repo supplies the board via
          # boards/seeed/xiao_ra4m1 and the port's native BOARD_DIR support.
          # v1.27.0 already ships the RA4M1 family (EK_RA4M1, RA4M1_CLICKER,
          # ra4m1_af.csv), and both old sed hacks are obsolete: main.c now
          # contains mp_cstack_init_with_top() as-is, and
          # MICROPY_FATFS_ENABLE_LFN is (2) (enabled, dynamic buffer).
          ./tools/apply_micropython_patches.sh
          cd lib/micropython/ports/renesas-ra
          make BOARD_DIR=../../../../boards/seeed/xiao_ra4m1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload Xiao RA4M1 firmware artifacts
      - name: Upload Xiao RA4M1 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-ra4m1-firmware
          path: |
            lib/micropython/ports/renesas-ra/build-xiao_ra4m1/firmware.hex

      # Upload Xiao RA4M1 artifacts to Release (only on release event)
      - name: Upload Xiao RA4M1 artifacts to Release
        if: github.event_name == 'release'
        run: |
          mv lib/micropython/ports/renesas-ra/build-xiao_ra4m1/firmware.hex lib/micropython/ports/renesas-ra/build-xiao_ra4m1/xiao_ra4m1.hex
          gh release upload ${{ github.event.release.tag_name }} \
            lib/micropython/ports/renesas-ra/build-xiao_ra4m1/xiao_ra4m1.hex \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}