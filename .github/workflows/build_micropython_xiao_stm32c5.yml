name: Build MicroPython Firmware for Seeed XIAO STM32C5

on:
  workflow_call:
    inputs:
      trigger:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.3'

      - name: Install host tools (pinned to the validated build environment)
        # Replicates the handoff-validated toolchain exactly:
        #   Python 3.12.3 / west 1.5.0 / gnuarmemb GCC 13.2.1 (apt) /
        #   CMake 3.31.2 / Ninja 1.11.1 / DTC 1.7.0
        # CI-built firmware from looser tool versions produced a binary that
        # hung before any console output on the real board; the locally
        # validated build used the versions pinned below. DTC 1.7.0 is newer
        # than Ubuntu 24.04 apt (1.6.1), so it is built from source.
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-arm-none-eabi flex bison \
            libyaml-dev pkg-config
          # Ninja 1.11.1 from pip (kitware build of the 1.11.1 sources; its
          # --version string carries a .git suffix). Ubuntu 24.04 apt ships
          # 1.13.2 now, which drifts from the validated environment.
          python -m pip install west==1.5.0 cmake==3.31.2 ninja==1.11.1 \
            jsonschema pyelftools requests PyYAML
          curl -sL --retry 3 --max-time 120 \
            https://github.com/dgibson/dtc/archive/refs/tags/v1.7.0.tar.gz \
            | tar xz -C /tmp
          make -C /tmp/dtc-1.7.0 -j2 NO_VALGRIND=1 NO_YAML=1 NO_PYTHON=1 >/dev/null
          make -C /tmp/dtc-1.7.0 PREFIX="$HOME/.local" NO_VALGRIND=1 NO_YAML=1 NO_PYTHON=1 install >/dev/null
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Verify pinned tool versions
        run: |
          set -e
          echo "python: $(python --version 2>&1)"
          echo "west:   $(west --version)"
          echo "cmake:  $(cmake --version | head -1)"
          echo "ninja:  $(ninja --version)"
          echo "dtc:    $(dtc --version)"
          echo "gcc:    $(arm-none-eabi-gcc --version | head -1)"
          test "$(python --version 2>&1)" = "Python 3.12.3"
          test "$(west --version)" = "West version: v1.5.0"
          test "$(cmake --version | head -1)" = "cmake version 3.31.2"
          ninja --version | grep -q "^1\.11\.1" || { echo "ninja not 1.11.1"; exit 1; }
          test "$(dtc --version)" = "Version: DTC 1.7.0"
          test "$(arm-none-eabi-gcc --version | head -1 | grep -o '13\.2\.1')" = "13.2.1"

      - name: Set up Zephyr 4.4.0
        run: |
          west init -m https://github.com/zephyrproject-rtos/zephyr --mr v4.4.0 zephyrproject
          cd zephyrproject
          west update
          west list

      - name: Build UF2
        env:
          ZEPHYR_BASE: ${{ github.workspace }}/zephyrproject/zephyr
          ZEPHYR_TOOLCHAIN_VARIANT: gnuarmemb
          GNUARMEMB_TOOLCHAIN_PATH: /usr
        run: |
          tools/xiao_stm32c5/build.sh

      - name: Assemble release package
        run: |
          tools/xiao_stm32c5/package.sh "${GITHUB_SHA::12}"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-stm32c5-micropython
          path: |
            build/xiao_stm32c5/zephyr/zephyr.elf
            build/xiao_stm32c5/zephyr/zephyr.bin
            build/xiao_stm32c5/zephyr/zephyr.hex
            build/xiao_stm32c5/zephyr/micropython-xiao-stm32c5.uf2
            dist/*.tar.gz

      - name: Upload package to GitHub Release
        if: github.event_name == 'release'
        run: gh release upload "${{ github.event.release.tag_name }}" dist/*.tar.gz --clobber
        env:
          GH_TOKEN: ${{ github.token }}
