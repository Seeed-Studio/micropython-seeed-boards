name: Build MicroPython Firmware for Seeed Xiao nRF54LM20A

on:
  workflow_call:
    inputs:
      trigger:
        required: true
        type: string
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Clean disk space before build
      - name: Clean disk space before build
        run: |
          sudo apt clean
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/hostedtoolcache || true
          docker system prune -f || true
          npm cache clean --force || true

      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Set up Python (required for Zephyr and west)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Install Zephyr dependencies
      - name: Install Zephyr dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git cmake ninja-build gperf ccache \
            dfu-util device-tree-compiler python3-dev python3-pip python3-setuptools \
            python3-tk python3-wheel xz-utils file libpython3-dev libffi-dev gh
          pip3 install west

      # Initialize Nordic nRF Connect SDK v3.3.0 (XIAO nRF54LM20A validated revision)
      - name: Set up NCS v3.3.0
        run: |
          west init -m https://github.com/nrfconnect/sdk-nrf --mr v3.3.0 ncs
          cd ncs
          west update
          west zephyr-export
          pip3 install -r zephyr/scripts/requirements.txt

      # Install Zephyr SDK
      - name: Install Zephyr SDK
        run: |
          wget https://github.com/zephyrproject-rtos/sdk-ng/releases/download/v0.17.0/zephyr-sdk-0.17.0_linux-x86_64.tar.xz
          mkdir -p ~/zephyr-sdk
          tar -xvf zephyr-sdk-0.17.0_linux-x86_64.tar.xz -C ~/zephyr-sdk
          cd ~/zephyr-sdk/zephyr-sdk-0.17.0
          ./setup.sh -t all -h

      # The official MicroPython v1.27.0 pin still uses the pre-Zephyr-4.x
      # Bluetooth advertiser option names (BT_LE_ADV_OPT_CONNECTABLE /
      # BT_LE_ADV_OPT_ONE_TIME) that NCS v3.3.0 removed; the pinned patch set
      # carries the rename.  Same step as the nRF54LM20B job.
      - name: Apply pinned MicroPython compatibility patch
        run: ./tools/apply_micropython_patches.sh

      # Build MicroPython for Xiao nRF54LM20A
      # Uses lib/micropython directly (the submodule pin) -- no PR checkout override.
      - name: Build for Xiao nRF54LM20A
        run: |
          source ncs/zephyr/zephyr-env.sh
          export PROJECT_DIR=$(pwd)
          west build --build-dir ./build_nrf54lm20a ./lib/micropython/ports/zephyr \
            --pristine \
            --board xiao_nrf54lm20a/nrf54lm20a/cpuapp \
            --sysbuild \
            -- \
            -DBOARD_ROOT=$PROJECT_DIR/ \
            -DEXTRA_DTC_OVERLAY_FILE=$PROJECT_DIR/boards/xiao_nrf54lm20a_nrf54lm20a_cpuapp.overlay \
            -DPM_STATIC_YML_FILE=$PROJECT_DIR/boards/pm_static_xiao_nrf54lm20a_nrf54lm20a_cpuapp.yml \
            -DEXTRA_CONF_FILE=$PROJECT_DIR/boards/xiao_nrf54lm20a_nrf54lm20a_cpuapp.conf
        env:
          ZEPHYR_SDK_INSTALL_DIR: ~/zephyr-sdk/zephyr-sdk-0.17.0

      # Upload Xiao nRF54LM20A firmware artifacts
      - name: Upload Xiao nRF54LM20A artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiao-nrf54lm20a-firmware
          path: |
            build_nrf54lm20a/zephyr/zephyr/zephyr.elf
            build_nrf54lm20a/zephyr/zephyr/zephyr.hex

      # Upload Xiao nRF54LM20A artifacts to Release (only on release event)
      - name: Upload Xiao nRF54LM20A artifacts to Release
        if: github.event_name == 'release'
        run: |
          mv build_nrf54lm20a/zephyr/zephyr/zephyr.hex build_nrf54lm20a/zephyr/zephyr/xiao_nrf54lm20a.hex
          gh release upload ${{ github.event.release.tag_name }} \
            build_nrf54lm20a/zephyr/zephyr/xiao_nrf54lm20a.hex \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
