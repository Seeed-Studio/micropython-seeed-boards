CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_NPM13XX_CHARGER=y

CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y

CONFIG_PWM=y
CONFIG_PWM_CAPTURE=y

CONFIG_POWEROFF=y
CONFIG_HWINFO=y
CONFIG_PM_DEVICE=y

CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_BACKEND_DUMMY=y

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_L2CAP_TX_MTU=252
CONFIG_BT_BUF_ACL_RX_SIZE=256
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n
CONFIG_BT_EXT_ADV=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y

CONFIG_MICROPY_FROZEN_MODULES=y
CONFIG_MICROPY_FROZEN_MANIFEST="../../../../boards/xiao_nrf54lm20b_manifest.py"
CONFIG_LEGACY_GENERATED_INCLUDE_PATH=y

# The application console and MicroPython REPL use USB CDC ACM. The
# precompiled MCUboot USB loader remains a separate CDC device (2886:0013);
# the application uses this distinct identity (2886:8013).
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
# MicroPython's src/usbd.c owns the single USB device instance and registers
# this CDC ACM class; do not also start Zephyr's standalone CDC device.
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_MICROPY_USB_DEVICE_VID=0x2886
CONFIG_MICROPY_USB_DEVICE_PID=0x8013

# The factory boot chain is fixed: MCUboot at 0x000000, the main application
# in slot0 at 0x006000, and the USB MCUmgr loader in slot1 at 0x1c4000.  This
# tells Zephyr's image tool to create the main-application image accepted by
# that firmware-updater boot mode (including --overwrite-only and --align 1).
CONFIG_MCUBOOT_BOOTLOADER_MODE_FIRMWARE_UPDATER=y
# The precompiled MCUboot validates a pure Ed25519 signature (the hash is not
# signed separately). Keep the corresponding private key outside this repo and
# pass it at configure time with CONFIG_MCUBOOT_SIGNATURE_KEY_FILE.
CONFIG_MCUBOOT_BOOTLOADER_SIGNATURE_TYPE_PURE=y
CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION="0.0.1+0"
