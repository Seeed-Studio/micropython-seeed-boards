# USB CDC ACM console for the XIAO nRF52840 (classic "xiao_ble" board).
#
# Neither upstream Zephyr's xiao_ble board nor MicroPython's ports/zephyr
# defaults enable the USB device stack, so firmware built for this board was
# headless: it booted but never enumerated a serial port (verified on
# hardware 2026-09-29 — the released v1.3 xiao_nrf52840.uf2 behaves the same).
#
# This build pins NCS v3.0.2 = Zephyr 3.7, where "zephyr,cdc-acm-uart" is
# bound by the classic (old) USB device stack: use USB_DEVICE_STACK +
# USB_CDC_ACM.  Do NOT enable USB_DEVICE_STACK_NEXT here: on 3.7 that pulls
# in the experimental next stack alongside the DT-compatible-selected old
# driver and the link fails with multiple-definition of __device_dts_ord
# (both stacks instantiate the same devicetree nodes).

CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y

